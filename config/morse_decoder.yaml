# Configuration du décodeur Morse
output_dir: data            # Répertoire pour les fichiers de sortie (debug capture, etc.)
debug: false                # Active le mode debug (traces et enregistrement debug_capture.wav)

# Paramètres temporisation / timing
unit_ms: 60                 # Durée d'un point en ms (~20 WPM)
dash_units: 2.0             # Seuil (en unités) pour distinguer tiret de point
letter_gap_units: 4.5       # Seuil (en unités) de fin de lettre
word_gap_units: 12.0        # Seuil (en unités) de fin de mot

# Paramètres audio / Goertzel
freq: 600                   # Fréquence cible du bip (Hz)
rate: 48000                 # Fréquence d'échantillonnage demandée
blocksize: 512              # Taille de bloc audio traitée à chaque itération (plus petit = latence réduite)
target_rate: 48000          # Fréquence cible lors de la conversion ffmpeg
threshold: 0.02             # Seuil RMS manuel; null pour auto
device: 71                  # Périphérique d'entrée (id ou nom)
word_sep: " "               # Caractère séparateur de mots dans la sortie
quit_key: "q"               # Touche pour quitter proprement en live (si supportée)
